<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Mscale</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .login-bg {
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59,130,246,0.08), transparent),
                radial-gradient(ellipse 60% 50% at 100% 100%, rgba(251,191,36,0.06), transparent),
                #030712;
        }
        .card-glow {
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 48px rgba(0,0,0,0.45);
        }
    </style>
</head>
<body class="login-bg min-h-full flex items-center justify-center p-4 antialiased text-gray-100">

    <div class="w-full max-w-md">
        <!-- Logo + brand -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-20 h-20 mb-4 flex items-center justify-center">
                <img src="assets/logo.png" alt="Mscale" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Mscale</h1>
            <p class="text-sm text-gray-400 mt-1">Admin Console</p>
        </div>

        <!-- Login card -->
        <div class="bg-gray-900/80 backdrop-blur-sm border border-white/10 rounded-2xl p-6 card-glow">
            <h2 id="auth-heading" class="text-lg font-semibold text-white mb-1">Welcome back</h2>
            <p id="auth-subheading" class="text-sm text-gray-400 mb-6">Sign in to manage your devices and network.</p>

            <div id="error-banner" class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/25 text-red-400 text-sm"></div>

            <form id="login-form" class="space-y-4" onsubmit="submitAuth(event)">
                <div id="register-name-field" class="hidden">
                    <label for="register-name" class="block text-xs font-medium text-gray-400 mb-1.5">Your name</label>
                    <input type="text" id="register-name" autocomplete="name"
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Jane Doe">
                </div>
                <div>
                    <label for="email" class="block text-xs font-medium text-gray-400 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="block text-xs font-medium text-gray-400 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="••••••••">
                </div>
                <div id="register-confirm-field" class="hidden">
                    <label for="register-confirm" class="block text-xs font-medium text-gray-400 mb-1.5">Confirm password</label>
                    <input type="password" id="register-confirm" autocomplete="new-password"
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl px-4 py-3 text-sm shadow-md transition flex items-center justify-center gap-2">
                    <span id="login-btn-text">Sign in</span>
                    <svg id="login-spinner" class="hidden animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </button>
            </form>

            <p class="text-center text-xs text-gray-500 mt-4">
                <span id="auth-toggle-hint">Don't have an account?</span>
                <button type="button" id="auth-mode-toggle" onclick="toggleAuthMode()" class="font-semibold text-blue-400 hover:underline ml-1">Create account</button>
            </p>

            <div id="oauth-divider" class="relative my-5">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-700"></div></div>
                <div class="relative flex justify-center text-xs"><span class="bg-gray-900/80 px-3 text-gray-500">or</span></div>
            </div>

            <button type="button" id="google-btn" onclick="loginWithGoogle()"
                class="w-full flex items-center justify-center gap-3 py-2.5 px-4 border border-gray-700 rounded-xl bg-gray-950 text-sm font-medium text-gray-300 hover:bg-gray-800 transition">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">Secure mesh VPN · WireGuard powered</p>
    </div>

    <script>
        const API = (() => {
            const p = window.location.pathname || '';
            return p.startsWith('/mscale') ? '/mscale/api' : '/api';
        })();

        async function checkAlreadyLoggedIn() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('logout') === '1') return;
            try {
                const res = await fetch(API + '/me', { credentials: 'include' });
                if (res.ok) {
                    const redirect = params.get('redirect');
                    if (redirect && redirect.startsWith('/')) {
                        window.location.href = redirect;
                    } else {
                        window.location.href = window.location.pathname.startsWith('/mscale') ? '/mscale/' : '/';
                    }
                }
            } catch (_) {}
        }

        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        let authMode = 'signin';

        function setAuthMode(mode) {
            authMode = mode === 'create' ? 'create' : 'signin';
            const isCreate = authMode === 'create';
            document.getElementById('register-name-field')?.classList.toggle('hidden', !isCreate);
            document.getElementById('register-confirm-field')?.classList.toggle('hidden', !isCreate);
            document.getElementById('oauth-divider')?.classList.toggle('hidden', isCreate);
            document.getElementById('google-btn')?.classList.toggle('hidden', isCreate);
            document.getElementById('auth-heading').textContent = isCreate ? 'Create your account' : 'Welcome back';
            document.getElementById('auth-subheading').textContent = isCreate
                ? 'Set up a new Mscale account to connect your devices.'
                : 'Sign in to manage your devices and network.';
            document.getElementById('login-btn-text').textContent = isCreate ? 'Create account' : 'Sign in';
            document.getElementById('auth-toggle-hint').textContent = isCreate ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('auth-mode-toggle').textContent = isCreate ? 'Sign in' : 'Create account';
            document.getElementById('password').autocomplete = isCreate ? 'new-password' : 'current-password';
        }

        function toggleAuthMode() {
            document.getElementById('error-banner').classList.add('hidden');
            setAuthMode(authMode === 'create' ? 'signin' : 'create');
        }

        function submitAuth(e) {
            if (e) e.preventDefault();
            if (authMode === 'create') registerUser();
            else loginUser();
        }

        function redirectAfterAuth() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (redirect && redirect.startsWith('/')) {
                window.location.href = redirect;
            } else {
                window.location.href = window.location.pathname.startsWith('/mscale') ? '/mscale/' : '/';
            }
        }

        async function registerUser() {
            document.getElementById('error-banner').classList.add('hidden');
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('register-confirm').value;
            if (!name || !email || !password) {
                showError('Please enter your name, email, and password.');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }
            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }
            setLoading(true, 'Creating account…');
            try {
                const res = await fetch(API + '/auth/register', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(data.error || 'Could not create account.');
                    return;
                }
                const loginRes = await fetch(API + '/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (loginRes.ok) {
                    redirectAfterAuth();
                    return;
                }
                showError('Account created. Please sign in with your new credentials.');
                setAuthMode('signin');
            } catch (_) {
                showError('Network error. Please try again.');
            } finally {
                setLoading(false);
            }
        }

        function setLoading(on, label) {
            document.getElementById('login-btn').disabled = on;
            document.getElementById('login-btn-text').textContent = on ? (label || 'Signing in…') : (authMode === 'create' ? 'Create account' : 'Sign in');
            document.getElementById('login-spinner').classList.toggle('hidden', !on);
        }

        async function loginUser(e) {
            if (e) e.preventDefault();
            document.getElementById('error-banner').classList.add('hidden');
            setLoading(true);
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    redirectAfterAuth();
                    return;
                }
                showError(data.error || 'Sign in failed. Check your credentials.');
            } catch (_) {
                showError('Network error. Please try again.');
            } finally {
                setLoading(false);
            }
        }

        function loginWithGoogle() {
            window.location.href = API + '/auth/google/login';
        }

        checkAlreadyLoggedIn();
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'create') setAuthMode('create');
    </script>
</body>
</html>
